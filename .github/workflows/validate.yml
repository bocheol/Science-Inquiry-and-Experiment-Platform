name: Validate platform
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PDF_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.19.0
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm cloud:check
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_DB: science_inquiry_integration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCIENCE_POSTGRES_INTEGRATION: "1"
      SCIENCE_TEST_POSTGRES_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/science_inquiry_integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:postgres
  standalone-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: docker build -t science-inquiry-validation .
      - name: Check packaged document and photo processors without network access
        run: >-
          docker run --rm --network none
          --mount type=bind,source="$PWD/scripts/verify-standalone-extraction.mjs",target=/verify/standalone.mjs,readonly
          --mount type=bind,source="$PWD/src/lib/student-records/extraction.ts",target=/verify/extraction.ts,readonly
          --entrypoint node science-inquiry-validation
          /verify/standalone.mjs /verify/extraction.ts
      - name: Prepare fixed-source normal rollback and maintenance images
        run: python scripts/deployment/create-ci-package.py "$RUNNER_TEMP/integrated-ci"
      - run: docker build -t science-inquiry-normal-rollback "$RUNNER_TEMP/integrated-ci/rollback"
      - run: docker build -f "$RUNNER_TEMP/integrated-ci/recovery/Dockerfile" -t science-inquiry-maintenance "$RUNNER_TEMP/integrated-ci"
      - name: Verify actual backup/restore and normal application recovery with synthetic data
        run: node --experimental-transform-types --import ./scripts/local-ts-loader.mjs scripts/deployment/rollback-drill.mjs
  deployment-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run Python state, executor, preparation and Node recovery checks in a restricted environment
        run: python scripts/deployment/run-isolated-tests.py
